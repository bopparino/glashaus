name: v3 checks
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Save synthetic browser review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review-${{ matrix.os }}
          path: .impeccable/review/browser-regression/
          retention-days: 7
          if-no-files-found: ignore
      - run: node bin/glashaus-v3.js --version
      - run: node tests/portable-smoke.cjs .
      - name: Prepare Linux user service session
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Test native background service on disposable runner
        env:
          GLASHAUS_TEST_NATIVE_SERVICE: '1'
        run: node tests/service-native.ts
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $syntaxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors) { throw ($syntaxErrors | Out-String) }
