name: v3 checks
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: node bin/glashaus-v3.js --version
      - run: node tests/portable-smoke.cjs .
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $syntaxErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$syntaxErrors) | Out-Null
          if ($syntaxErrors) { throw ($syntaxErrors | Out-String) }
